name: Stayflexi Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Type-Check, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Monorepo Type-Check (All 28 Packages)
        run: |
          npm run type-check
          npm run type-check:all

      - name: Lint Microservices & Packages
        run: npm run lint:services

      - name: Run Microservices Unit Tests
        run: npm run test:services

      - name: Run Platform Validation Test Suite
        run: npm test --prefix platform-validation

      - name: Production Build Check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_NAME: 'stayflexi'
          APP_VERSION: '6.9.0'
          JWT_SECRET: 'stayflexi-super-secure-production-jwt-secret-key-that-is-at-least-64-characters-long'
          JWT_REFRESH_SECRET: 'stayflexi-super-secure-production-jwt-refresh-secret-key-that-is-at-least-64-chars'
          API_BASE_URL: 'http://localhost:3000'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/stayflexi_dev?schema=public'
          REDIS_URL: 'redis://localhost:6379'
          KAFKA_BROKERS: 'localhost:9092'
