# External Secrets Operator — SecretStore for Stayflexi
# See docs/secrets-management.md for auth model and Vault path conventions.
#
# Prerequisites (cluster-admin, once per cluster):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   vault auth enable kubernetes  # and create role stayflexi-external-secrets
#
# This SecretStore is namespaced. For a shared store across namespaces use
# ClusterSecretStore (uncomment kind below and drop namespace).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: stayflexi-vault-backend
  namespace: stayflexi
spec:
  provider:
    vault:
      server: https://vault.stayflexi.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: stayflexi-external-secrets
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
# ServiceAccount bound to the Vault Kubernetes auth role.
# The ESO controller uses this SA to fetch secrets from Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
---
# Staging variant — points at the same Vault but a different KV prefix (stayflexi-staging/*).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: stayflexi-vault-backend-staging
  namespace: stayflexi-staging
spec:
  provider:
    vault:
      server: https://vault.stayflexi.internal:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: stayflexi-external-secrets-staging
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
