# ExternalSecret for the database URL — production uses Vault, not inline base64.
# Vault KV v2 path: secret/stayflexi/database  (field: DATABASE_URL)
# Local fallback: `kubectl create secret generic stayflexi-db-secret --from-literal=DATABASE_URL=...`
# See docs/secrets-management.md § "Vault layout".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stayflexi-db-secret
  namespace: stayflexi
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stayflexi-vault-backend
  target:
    name: stayflexi-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app: stayflexi-db
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: stayflexi/database
        property: DATABASE_URL
---
# Staging counterpart — reads from stayflexi-staging/database.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stayflexi-db-secret
  namespace: stayflexi-staging
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stayflexi-vault-backend-staging
  target:
    name: stayflexi-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: stayflexi-staging/database
        property: DATABASE_URL
