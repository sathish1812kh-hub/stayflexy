# ExternalSecrets for app-tier secrets — JWT, service-to-service key, and Redis URL.
# Vault KV v2 layout:
#   secret/stayflexi/jwt      -> { JWT_SECRET }
#   secret/stayflexi/service  -> { SERVICE_KEY }
#   secret/stayflexi/redis    -> { REDIS_URL }
# Keys are injected as Kubernetes Secrets (stayflexi-jwt-secret etc.) and
# consumed by Deployments via env.valueFrom.secretKeyRef — no hardcoded values.
# See docs/secrets-management.md for rotation and local fallback.

# ── JWT secret ────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stayflexi-jwt-secret
  namespace: stayflexi
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stayflexi-vault-backend
  target:
    name: stayflexi-jwt-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: stayflexi/jwt
        property: JWT_SECRET
---
# ── Service key (S2S auth) ──────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stayflexi-service-secret
  namespace: stayflexi
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stayflexi-vault-backend
  target:
    name: stayflexi-service-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: SERVICE_KEY
      remoteRef:
        key: stayflexi/service
        property: SERVICE_KEY
---
# ── Redis URL ───────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stayflexi-redis-secret
  namespace: stayflexi
  labels:
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: stayflexi-vault-backend
  target:
    name: stayflexi-redis-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: stayflexi/redis
        property: REDIS_URL
---
# ── Staging — same three secrets under stayflexi-staging/* ──────────────────
